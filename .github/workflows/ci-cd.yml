name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile dashboard/app.py

      - name: Verify artifacts exist
        run: |
          test -f artifacts/champion_model.pkl
          test -f artifacts/scaler.pkl
          test -f artifacts/shap_explainer.pkl
          echo "All required artifacts present."

  docker-build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t fraud-detection-dashboard:ci .

      - name: Confirm image was built
        run: |
          docker images fraud-detection-dashboard:ci
